name: sync-planning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-planning.yml"
      - "config/p0-policy.v1.json"
      - "docs/product/**"
      - "docs/design/**"
      - "docs/work-items/index.md"
      - "scripts/sync_github_planning.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-planning-main
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate planning source
        run: python3 scripts/sync_github_planning.py
      - name: Synchronize labels, milestones, and issues
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/sync_github_planning.py --apply \
            > docs/work-items/github-sync-result.json \
            2> /tmp/quanthus-planning-error.log; then
            exit 0
          fi
          jq -n \
            --rawfile error /tmp/quanthus-planning-error.log \
            '{status: "failed", error: $error}' \
            > docs/work-items/github-sync-result.json
          exit 1
      - name: Record synchronization result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/work-items/github-sync-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record GitHub planning sync [skip ci]"
          git push
      - name: Propagate synchronization failure
        if: steps.sync.outcome == 'failure'
        run: exit 1
