name: quanthus-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quanthus_platform
      POSTGRES_USER: quanthus_platform
      POSTGRES_PASSWORD: ${QUANTHUS_PLATFORM_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quanthus_platform -d quanthus_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - quanthus-platform-postgres:/var/lib/postgresql/data

  api:
    image: ${QUANTHUS_PLATFORM_IMAGE:-quanthus-platform-kernel:local}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${QUANTHUS_PLATFORM_POSTGRES_PASSWORD:?required}
      QUANTHUS_PLATFORM_DATABASE_URL: postgresql://quanthus_platform@postgres:5432/quanthus_platform
      QUANTHUS_PLATFORM_MFA_KEY: ${QUANTHUS_PLATFORM_MFA_KEY:?required}
      QUANTHUS_ATTRIBUTION_PUBLICATION_ROOT: /data/attribution-releases
      QUANTHUS_CANDIDATE_RUN_ROOT: /data/candidate-runs
      QUANTHUS_EVENT_RUN_ROOT: /data/event-runs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2))['status'] == 'ready'"
      interval: 10s
      timeout: 3s
      retries: 12
    tmpfs:
      - /tmp
    volumes:
      - ${QUANTHUS_ATTRIBUTION_PUBLICATION_ROOT:?required}:/data/attribution-releases:ro
      - quanthus-candidate-runs:/data/candidate-runs:ro
      - quanthus-event-runs:/data/event-runs:ro

  replay-worker:
    image: ${QUANTHUS_REPLAY_IMAGE:-quanthus-replay:local}
    restart: unless-stopped
    entrypoint: ["python", "-m", "quanthus.platform.worker"]
    environment:
      PGPASSWORD: ${QUANTHUS_PLATFORM_POSTGRES_PASSWORD:?required}
      QUANTHUS_PLATFORM_DATABASE_URL: postgresql://quanthus_platform@postgres:5432/quanthus_platform
      QUANTHUS_WORKER_ID: oci-replay-1
      QUANTHUS_CANDIDATE_RUN_ROOT: /data/candidate-runs
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 45s
    volumes:
      - /srv/quanthus:/srv/quanthus:ro
      - quanthus-candidate-runs:/data/candidate-runs

  event-worker:
    image: ${QUANTHUS_EVENT_IMAGE:-quanthus-event:local}
    restart: unless-stopped
    entrypoint: ["python", "-m", "quanthus.platform.event_worker"]
    environment:
      PGPASSWORD: ${QUANTHUS_PLATFORM_POSTGRES_PASSWORD:?required}
      QUANTHUS_PLATFORM_DATABASE_URL: postgresql://quanthus_platform@postgres:5432/quanthus_platform
      QUANTHUS_WORKER_ID: oci-event-1
      QUANTHUS_EVENT_RUN_ROOT: /data/event-runs
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 45s
    volumes:
      - /srv/quanthus/dwd-dws-v2.1/base/dwd-base-202607-v2.1:/srv/quanthus/dwd-dws-v2.1/base/dwd-base-202607-v2.1:ro
      - /srv/quanthus/dwd-dws-v2.1/corrections/dwd-base-202607-v2.1-correction-20260813-001:/srv/quanthus/dwd-dws-v2.1/corrections/dwd-base-202607-v2.1-correction-20260813-001:ro
      - /srv/quanthus/research-bundles/development/strategy-replay-development-1f1ea4d-v1:/srv/quanthus/research-bundles/development/strategy-replay-development-1f1ea4d-v1:ro
      - quanthus-event-runs:/data/event-runs

  web:
    image: ${QUANTHUS_PLATFORM_WEB_IMAGE:-quanthus-platform-web:local}
    restart: unless-stopped
    environment:
      QUANTHUS_PLATFORM_API_ORIGIN: http://api:8080
      QUANTHUS_ATTRIBUTION_PUBLICATION_ROOT: /data/attribution-releases
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.quanthus.rule=Host(`quanthus.oci.061718.xyz`) && !Path(`/metrics`)"
      - "traefik.http.routers.quanthus.entrypoints=websecure"
      - "traefik.http.routers.quanthus.tls=true"
      - "traefik.http.routers.quanthus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.quanthus.service=quanthus-web"
      - "traefik.http.routers.quanthus.middlewares=quanthus-security"
      - "traefik.http.services.quanthus-web.loadbalancer.server.port=3100"
      - "traefik.http.middlewares.quanthus-security.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.quanthus-security.headers.framedeny=true"
      - "traefik.http.middlewares.quanthus-security.headers.referrerpolicy=same-origin"
      - "traefik.http.middlewares.quanthus-security.headers.stsseconds=31536000"
      - "traefik.http.middlewares.quanthus-security.headers.permissionspolicy=camera=(),geolocation=(),microphone=()"
    read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/ready').then(r=>{if(!r.ok)throw Error(r.status)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
    tmpfs:
      - /tmp
    volumes:
      - ${QUANTHUS_ATTRIBUTION_PUBLICATION_ROOT:?required}:/data/attribution-releases:ro

volumes:
  quanthus-platform-postgres:
  quanthus-candidate-runs:
  quanthus-event-runs:

networks:
  traefik-net:
    external: true
