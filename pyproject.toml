[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanthus"
version = "0.1.0.dev0"
description = "Point-in-time A-share event-driven trading research platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Quanthus maintainers" }]
dependencies = []

[project.optional-dependencies]
supplement-sources = [
  "astock-sources @ https://github.com/rv198-star/astock/releases/download/sources-v0.1.1/astock_sources-0.1.1-py3-none-any.whl#sha256=49b04b404016fa5432acb12a1bbfdd5a2a4268adbd3a4e44a1f16adc53b1eebf",
]
supplement-sources-v2 = [
  "astock-sources @ https://github.com/rv198-star/astock/releases/download/sources-v0.1.2/astock_sources-0.1.2-py3-none-any.whl#sha256=5311abc0c2ecfd89be787c4fda4ba7edd03f9079ab9954ce026cf9b80a86f64d",
]
supplement-sources-v3 = [
  "astock-sources @ https://github.com/rv198-star/astock/releases/download/sources-v0.1.3/astock_sources-0.1.3-py3-none-any.whl#sha256=b6d6cd358164d0ea3bde7d98020c54b8001800ca4aea7c9538fa539f6925d1b4",
]
supplement-sources-v4 = [
  "astock-sources @ https://github.com/rv198-star/astock/releases/download/sources-v0.1.4/astock_sources-0.1.4-py3-none-any.whl#sha256=2880d1e261bcbc50a35296aefab7cd66ce2a4f3a7a85de2ed53835c542583ffe",
]
platform = [
  "cryptography>=45,<46",
  "gunicorn>=26,<27",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<24",
]
p1 = [
  "duckdb>=1.1,<2",
  "polars>=1.17,<2",
  "pyarrow>=18,<24",
  "pytz>=2024.1",
]
stage-training = [
  "duckdb>=1.1,<2",
  "numpy>=2.1,<3",
  "psutil>=6,<8",
  "pyarrow>=18,<24",
  "pytz>=2024.1",
  "scikit-learn>=1.6,<2",
]
p5-stage-training = [
  "duckdb>=1.1,<2",
  "numpy>=2.1,<3",
  "psutil>=6,<8",
  "pyarrow>=18,<24",
  "pytz>=2024.1",
  "scikit-learn>=1.6,<2",
  "torch>=2.5,<3",
]
ods = [
  "baostock>=0.9.3,<0.10",
  "mootdx>=0.11,<0.12",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "requests>=2.31,<3",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
quanthus = "quanthus.cli:main"
quanthus-platform = "quanthus.platform.server:main"
quanthus-replay-worker = "quanthus.platform.worker:main"
quanthus-event-worker = "quanthus.platform.event_worker:main"
quanthus-event-shard-worker = "quanthus.platform.event_shard_worker:main"
quanthus-minute-tdx = "quanthus.providers.minute_tdx:main"
quanthus-ods-snapshot = "quanthus.providers.ods_snapshot:main"
quanthus-calendar-refresh = "quanthus.providers.trading_calendar:main"
quanthus-p5-cpu-probe = "quanthus.stage_learning.p5_compute_probe:main"
quanthus-p10-supplement = "quanthus.p10_supplement:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["quanthus"]
