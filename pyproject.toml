[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanthus"
version = "0.1.0.dev0"
description = "Point-in-time A-share event-driven trading research platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Quanthus maintainers" }]
dependencies = []

[project.optional-dependencies]
platform = [
  "cryptography>=45,<46",
  "gunicorn>=26,<27",
  "psycopg[binary]>=3.2,<4",
]
p1 = [
  "duckdb>=1.1,<2",
  "polars>=1.17,<2",
  "pyarrow>=18,<24",
  "pytz>=2024.1",
]
ods = [
  "baostock>=0.9.3,<0.10",
  "mootdx>=0.11,<0.12",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "requests>=2.31,<3",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
quanthus = "quanthus.cli:main"
quanthus-platform = "quanthus.platform.server:main"
quanthus-replay-worker = "quanthus.platform.worker:main"
quanthus-minute-tdx = "quanthus.providers.minute_tdx:main"
quanthus-ods-snapshot = "quanthus.providers.ods_snapshot:main"
quanthus-calendar-refresh = "quanthus.providers.trading_calendar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["quanthus"]
